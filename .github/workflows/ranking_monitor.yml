name: 14-Day Ranking Monitor

on:
  schedule:
    # Every 14 days on Monday at 10am IST (4:30am UTC)
    - cron: '30 4 1,15 * *'
  workflow_dispatch: # allows manual trigger

jobs:
  check-rankings-and-rewrite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config directory
        run: mkdir -p config outputs

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > config/google_credentials.json

      - name: Write Google token
        run: echo '${{ secrets.GOOGLE_TOKEN }}' > config/token.json

      - name: Write .env file
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "SERP_API_KEY=${{ secrets.SERP_API_KEY }}" >> .env
          echo "WP_ACCESS_TOKEN=${{ secrets.WP_ACCESS_TOKEN }}" >> .env
          echo "WP_CLIENT_ID=${{ secrets.WP_CLIENT_ID }}" >> .env
          echo "WP_CLIENT_SECRET=${{ secrets.WP_CLIENT_SECRET }}" >> .env
          echo "WP_USERNAME=${{ secrets.WP_USERNAME }}" >> .env
          echo "WP_PASSWORD=${{ secrets.WP_PASSWORD }}" >> .env
          echo "WP_SITE_URL=${{ secrets.WP_SITE_URL }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Restore published articles data
        run: echo '${{ secrets.PUBLISHED_ARTICLES }}' > outputs/published_articles.json

      - name: Check rankings
        run: python pipeline/phase5_rankings/check_rankings.py

      - name: Run rewrite engine
        run: python pipeline/phase5_rankings/rewrite_articles.py

      - name: Push updated data to Supabase
        run: python pipeline/phase6_dashboard/push_to_supabase.py